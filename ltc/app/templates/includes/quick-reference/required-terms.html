<h3 id="requirements">Requirements</h3>
<p>The table below provides a summary of the required terms in Latimer Core.</p>

<div class="table-outer-wrapper">
    <div class="term-table-wrapper">
        <h5 class="table-header">Required Terms</h5>
        <div class="table-responsive print-avoid">
            <table class="table table-compact table-terms">
                <thead>
                    <tr>
                        <th>Term</th>
                        <th>Label</th>
                        <th>Required</th>
                    </tr>
                </thead>
                <tbody>
                    {% for idx, v in requiredTerms.iterrows() %}
                        <tr>
                            <td><a href="#{{ v['term_local_name'] }}">{{ v['namespace'] }}{{ v['term_local_name'] }}</a></td>
                            <td>{{ v['label'] }}</td>
                            <td>{{ v['is_required'] }}</td>
                        </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
